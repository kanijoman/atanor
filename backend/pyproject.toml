[project]
name = "atanor-backend"
version = "0.1.0"
description = "Backend for the Atanor platform."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
