[project]
name = "atanor-backend"
version = "0.1.0"
description = "Backend for the Atanor platform."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.15,<2.0",
    "pypdf>=6.0,<7.0",
]

[project.scripts]
atanor = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx2>=2.12,<3.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: calls live external services; run with -m network"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF"]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-branches = 12

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
explicit_package_bases = true
mypy_path = "."

# Baseline: existing violations tolerated until the file is refactored (AT-110).
# Remove an entry as soon as its file complies; never add new entries.
[tool.ruff.lint.per-file-ignores]
"app/application/study_material.py" = ["E501", "PLR0911"]
"app/cli.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
# Scripts must set the environment before importing the application.
"scripts/*.py" = ["E402"]
"scripts/check_database_hygiene.py" = ["C901", "B007"]
"tests/test_migrations.py" = ["PLR0915"]
